{% extends 'main/base.html' %}

{% load static %}

{% block title %}Пароль обновлён{% endblock %}

{% block content %}
<div class="login profile-page">
    <div class="profile-card" style="max-width: 520px;">
        <div class="profile-header">
            <img src="{% static 'images/user_pic.png' %}" height="32px" alt="Пароль обновлён">
            <h2 class="head_text">Пароль обновлён</h2>
        </div>
        <p>Теперь вы можете войти в систему с новым паролем.</p>
        <div class="profile-actions">
            <a href="{% url 'user:login' %}" class="enter_button" style="display: inline-block; text-align: center; line-height: 30px;">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
