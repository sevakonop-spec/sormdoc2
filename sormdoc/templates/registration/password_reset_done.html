{% extends 'main/base.html' %}

{% load static %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="login profile-page">
    <div class="profile-card" style="max-width: 520px;">
        <div class="profile-header">
            <img src="{% static 'images/user_pic.png' %}" height="32px" alt="Письмо отправлено">
            <h2 class="head_text">Письмо отправлено</h2>
        </div>
        <p>Инструкции по восстановлению пароля отправлены на указанную почту.</p>
        <div class="profile-actions">
            <a href="{% url 'user:login' %}" class="enter_button" style="display: inline-block; text-align: center; line-height: 30px;">К входу</a>
        </div>
    </div>
</div>
{% endblock %}
