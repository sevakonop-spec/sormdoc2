{% extends 'main/base.html' %}

{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="login profile-page">
    <div class="profile-card" style="max-width: 520px;">
        <div class="profile-header">
            <img src="{% static 'images/user_pic.png' %}" height="32px" alt="Пароль изменён">
            <h2 class="head_text">Пароль успешно изменён</h2>
        </div>
        <p>Ваш пароль был обновлён.</p>
        <div class="profile-actions">
            <a href="{% url 'main:index' %}" class="enter_button" style="display: inline-block; text-align: center; line-height: 30px;">На главную</a>
        </div>
    </div>
</div>
{% endblock %}
